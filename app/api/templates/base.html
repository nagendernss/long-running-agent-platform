<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HelloCounsel Agents{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8d94a3;
            --active:#3ba55d; --blocked:#e0a800; --done:#6272a4; --accent:#7aa2f7; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
    header h1 { font-size:16px; margin:0; letter-spacing:.02em; }
    header .dim { color:var(--dim); font-size:12px; }
    main { padding:24px; max-width:1100px; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:28px 0 10px; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    code, .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; border:1px solid var(--line); }
    .active { color:var(--active); border-color:var(--active); }
    .blocked { color:var(--blocked); border-color:var(--blocked); }
    .completed, .paused { color:var(--done); border-color:var(--done); }
    .dim { color:var(--dim); }
    .empty { color:var(--dim); padding:14px; border:1px dashed var(--line); border-radius:8px; }
    button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
    button:hover { border-color:var(--accent); }
    form.inline { display:inline; }
    pre { margin:0; white-space:pre-wrap; word-break:break-word; }
    .req-summary { margin:3px 0 4px; }
    .req-details { display:flex; flex-wrap:wrap; gap:6px; }
    .kv { font-family:ui-monospace,Consolas,monospace; font-size:11px; background:#12151b;
          border:1px solid var(--line); border-radius:5px; padding:1px 7px; }
    form.resolve { display:flex; gap:6px; margin-bottom:6px; }
    input[type=text] { background:#12151b; color:var(--fg); border:1px solid var(--line);
                       border-radius:6px; padding:4px 8px; font-size:12px; }
    input[type=text]:focus { outline:none; border-color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">HelloCounsel Agent Platform</a></h1>
    <span class="dim">long-running agent workflows &middot; engine is workflow-agnostic</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
